name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC authentication with AWS
  contents: write   # for pushing changes to the repository (e.g., updating Kustomize image tags)
  security-events: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Static Security Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

