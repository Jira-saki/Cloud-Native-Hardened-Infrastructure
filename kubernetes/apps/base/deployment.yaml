apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: secure-api
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /bin/sh
            - -c
          args:
            - |
              export HOME=/tmp
              export PYTHONPATH=/app
              export PATH=/app/bin:$PATH
              cd /app
              pip install --no-cache-dir --target /app fastapi uvicorn prometheus-fastapi-instrumentator
              cat << 'EOC' > /app/main.py
              import time, math
              from fastapi import FastAPI
              from prometheus_fastapi_instrumentator import Instrumentator

              app = FastAPI(title="Secure-API", version="1.0.0")
              Instrumentator().instrument(app).expose(app, endpoint="/metrics")

              @app.get("/")
              def root():
                  return {"status": "healthy", "service": "secure-api"}

              @app.get("/healthz")
              def healthz():
                  return {"status": "ok"}

              @app.get("/cpu-burn")
              def burn(duration: float = 0.05):
                  start = time.time()
                  while time.time() - start < duration:
                      _ = math.sqrt(123456.789) * math.sin(9876.543)
                  return {"status": "burned", "duration": duration}
              EOC
              python3 -m uvicorn main:app --host 0.0.0.0 --port 8000  
          env:
            - name: APP_VERSION
              value: "v1.0.0"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          startupProbe:
              httpGet:
                path: /healthz
                port: 8000
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          volumeMounts:
            - mountPath: /app
              name: app-volume
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: app-volume
          emptyDir: {}
          