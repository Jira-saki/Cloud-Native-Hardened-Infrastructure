apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
spec:
  replicas: 2
  template:
    spec:
      serviceAccountName: secure-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault # RuntimeDefault seccomp profile
      containers:
        - name: secure-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # ReadOnlyRootFilesystem
            capabilities:
              drop:
                - ALL  # drop all capabilities
