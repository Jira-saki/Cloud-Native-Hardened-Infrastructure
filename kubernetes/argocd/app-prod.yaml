apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure.git'
    targetRevision: main
    path: kubernetes/apps/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: secure-api
  syncPolicy:
    automated:
      prune: true   # prevent Orphaned Resources
      selfHeal: true  # prevent Configuration Drift 
    syncOptions:
      - CreateNamespace=true
