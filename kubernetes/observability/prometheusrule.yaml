apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secure-api-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: secure-api
    role: alert-rules
spec:
  groups:
    - name: secure-api.recording.rules
      rules:
        - record: job:http_requests_total:rate5m
          expr: sum by (job, status, handler) (rate(http_requests_total[5m]))
        - record: job:http_request_duration_seconds:p95
          expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m])))

    - name: secure-api.alerting.rules
      rules:
        - alert: SecureApiDown
          expr: (kube_deployment_status_replicas_available{deployment="secure-api"} == 0) or (absent(up{job=~".*secure-api.*"}) == 1)
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "secure-api service is down"
            description: "No available replicas or scrape endpoints found for secure-api in the cluster."
            runbook_url: "https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure#pillar-5--full-stack-observability--two-tier-autoscaling"

        - alert: SecureApiHigh5xxErrorRate
          expr: |
            (
              sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
              /
              sum by (job) (rate(http_requests_total[5m]))
            ) * 100 > 5
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "High HTTP 5xx error rate on secure-api"
            description: "HTTP 5xx error rate exceeds 5% for more than 2 minutes (current: {{ $value | printf \"%.2f\" }}%)."
            runbook_url: "https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure#pillar-5--full-stack-observability--two-tier-autoscaling"

        - alert: SecureApiHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High p95 response latency on secure-api"
            description: "p95 latency is greater than 1.0s for more than 5 minutes (current: {{ $value | printf \"%.2f\" }}s)."
            runbook_url: "https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure#pillar-5--full-stack-observability--two-tier-autoscaling"

        - alert: SecureApiPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{container="secure-api"}[15m]) * 60 > 0.2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "secure-api pod is restarting frequently"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted frequently in the last 15 minutes."
            runbook_url: "https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure#pillar-5--full-stack-observability--two-tier-autoscaling"

        - alert: SecureApiHighCpuUsage
          expr: |
            (
              sum by (pod) (rate(container_cpu_usage_seconds_total{container="secure-api"}[5m]))
              /
              sum by (pod) (kube_pod_container_resource_limits{container="secure-api", resource="cpu"})
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "secure-api container CPU near saturation"
            description: "Pod {{ $labels.pod }} CPU usage is above 85% of limit for more than 5 minutes (current: {{ $value | printf \"%.2f\" }}%). Check HPA and Karpenter autoscaling status."
            runbook_url: "https://github.com/Jira-saki/Cloud-Native-Hardened-Infrastructure#pillar-5--full-stack-observability--two-tier-autoscaling"
